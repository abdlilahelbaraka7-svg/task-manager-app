<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Meine Aufgaben</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tasks"></i> Task Manager</h1>
            <p>Ein einfaches Projekt zur Verwaltung von täglichen Aufgaben.</p>
        </header>

        <form id="task-form">
            <input type="text" id="task-input" placeholder="Neue Aufgabe hinzufügen..." required>
            <button type="submit" id="add-btn"><i class="fas fa-plus"></i> Hinzufügen</button>
        </form>

        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">Alle</button>
            <button class="filter-btn" data-filter="pending">Offen</button>
            <button class="filter-btn" data-filter="completed">Erledigt</button>
        </div>

        <ul id="task-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
